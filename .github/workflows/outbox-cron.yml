name: Scheduled Email Outbox Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: outbox-cron-worker
  cancel-in-progress: false

jobs:
  process-outbox:
    name: Trigger /api/cron/process-outbox
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Dispatch queued email outbox batch
        env:
          APP_URL: ${{ vars.APP_URL || 'https://sketchhub-liard.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured in repository secrets. Skipping execution."
            exit 0
          fi
          TARGET_URL="${APP_URL%/}/api/cron/process-outbox"
          HTTP_STATUS=$(curl -sS -o /tmp/outbox-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "$TARGET_URL")
          cat /tmp/outbox-response.json
          echo ""
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Outbox worker failed with HTTP $HTTP_STATUS"
            exit 1
          fi
